name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC (sanitizers)
            os: ubuntu-latest
            cmake-args: -DCMAKE_CXX_COMPILER=g++ -DRV_WARNINGS_AS_ERRORS=ON -DRV_SANITIZE=ON
          - name: Linux GCC C++23
            os: ubuntu-latest
            cmake-args: -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_STANDARD=23 -DRV_WARNINGS_AS_ERRORS=ON
          - name: Linux Clang
            os: ubuntu-latest
            cmake-args: -DCMAKE_CXX_COMPILER=clang++ -DRV_WARNINGS_AS_ERRORS=ON
          - name: macOS AppleClang
            os: macos-latest
            cmake-args: -DRV_WARNINGS_AS_ERRORS=ON
          - name: Windows MSVC
            os: windows-latest
            cmake-args: ""

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  backend:
    name: Backend API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build the simulator
        run: npm run build:simulator

      - name: Test
        run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
